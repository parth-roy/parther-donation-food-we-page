name: Deploy DonateFood Web to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 60m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /var/www/donatefood.in
            git fetch origin main
            git reset --hard origin/main
            npm install
            # Clean previous .next build directory completely to prevent ENOTEMPTY standalone conflicts
            rm -rf .next 2>/dev/null || true
            npm run build
            # Copy static assets into standalone folder
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public
            pm2 reload donatefood-web || pm2 restart donatefood-web || pm2 start ecosystem.config.js --only donatefood-web
            pm2 save
